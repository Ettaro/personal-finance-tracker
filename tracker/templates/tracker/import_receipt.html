{% extends 'tracker/base.html' %}

{% block content %}
<div class="section-card">
    <span class="eyebrow">Import</span>
    <h1>Read receipt</h1>
    <p class="muted">Upload an image to prepare the document and preview the extracted text.</p>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <label for="receipt_image">Receipt image</label>
        <input type="file" name="receipt_image" id="receipt_image" accept="image/*" required>

        <button type="submit">Process image</button>
    </form>
</div>
{% endblock %}
