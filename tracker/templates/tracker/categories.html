{% extends 'tracker/base.html' %}

{% block content %}
    <h1>Categories</h1>

    <h2>Create Category</h2>
    <form method="POST">
        {% csrf_token %}
        <label for="name">Category Name:</label>
        <input type="text" name="name" id="name" maxlength="100" placeholder="Ex: Food, Leisure..." required>
        <button type="submit">Create</button>
    </form>

    <h2>Category List</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for category in categories %}
                <tr>
                    <td data-label="ID">{{ category.id }}</td>
                    <td data-label="Name">
                        <form method="POST" action="{% url 'edit_category' category.id %}" class="category-inline-form">
                            {% csrf_token %}
                            <input type="text" name="name" value="{{ category.name }}" maxlength="100" required>
                            <button type="submit">Save</button>
                        </form>
                    </td>
                    <td data-label="Actions">
                        <form method="POST" action="{% url 'delete_category' category.id %}" class="category-delete-form">
                            {% csrf_token %}
                            <button type="submit" class="danger-button">Delete</button>
                        </form>
                    </td>
                </tr>
            {% empty %}
                <tr>
                    <td colspan="3" style="text-align: center;">No categories found.</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>

<style>
    .category-inline-form,
    .category-delete-form {
        margin: 0;
        padding: 0;
        border: 0;
        background: transparent;
        display: flex;
        gap: 10px;
        align-items: center;
    }

    .category-inline-form input {
        min-width: 180px;
    }

    .category-inline-form button,
    .category-delete-form button {
        width: auto;
        white-space: nowrap;
    }

    .danger-button {
        background: linear-gradient(135deg, #c94336, #8f2f28);
    }

    @media (max-width: 720px) {
        table,
        thead,
        tbody,
        th,
        td,
        tr {
            display: block;
        }

        thead {
            display: none;
        }

        tbody {
            display: grid;
            gap: 12px;
        }

        tr {
            padding: 14px;
            border: 1px solid rgba(38, 59, 40, 0.08);
            border-radius: 18px;
            background: #fff;
        }

        td {
            padding: 8px 0;
            border: 0;
        }

        .category-inline-form,
        .category-delete-form {
            display: grid;
            grid-template-columns: 1fr;
        }

        .category-inline-form input,
        .category-inline-form button,
        .category-delete-form button {
            width: 100%;
        }

        td::before {
            content: attr(data-label);
            display: block;
            margin-bottom: 4px;
            color: var(--muted);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
    }
</style>
{% endblock %}
