{% extends 'tracker/base.html' %}

{% block content %}
    <h1>Categorias</h1>

    <h2>Criar Categoria</h2>
    <form method="POST">
        {% csrf_token %}
        <label for="name">Nome da Categoria:</label>
        <input type="text" name="name" id="name" maxlength="100" placeholder="Ex: Alimentacao, Lazer..." required>
        <button type="submit">Criar</button>
    </form>

    <h2>Lista de Categorias</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
            </tr>
        </thead>
        <tbody>
            {% for category in categories %}
                <tr>
                    <td>{{ category.id }}</td>
                    <td>{{ category.name }}</td>
                </tr>
            {% empty %}
                <tr>
                    <td colspan="2" style="text-align: center;">Nenhuma categoria encontrada.</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
